# Sample object-storage credentials Secret for KafkaBackup spec.storage.s3. The
# keys match the in-cluster MinIO root credentials (kafka-backup-minio.yaml).
# The operator mounts these as env vars on the backup workload — they are never
# written into the rendered config.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-backup-s3-creds
  namespace: kafka
type: Opaque
stringData:
  accessKeyId: minioadmin
  secretAccessKey: minioadmin
