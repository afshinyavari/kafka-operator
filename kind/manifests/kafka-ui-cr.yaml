apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaUI
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  image: kafka-ui:dev
  imagePullPolicy: IfNotPresent
  replicas: 1
  oidc:
    issuerUrl: "http://keycloak.kafka.svc.clusterset.local:8080/realms/demo"
    clientId: "kafka-ui-web"
    clientSecretRef:
      name: kafka-ui-oidc
      key: client-secret
  tls:
    secretName: kafka-proxy-test-client-tls
    mountPath: /etc/kafka-tls
  # External access — same shape as KafkaProxy. Default LOADBALANCER for the MetalLB demo;
  # switch to GATEWAY / INGRESS / NODEPORT as needed.
  externalAccess:
    type: LOADBALANCER
    # advertisedHostTemplate: "kafka-ui-${clusterId}.example.com"  # optional override
    # nodePort: 30808                                              # only used when type=NODEPORT
    # ingress:
    #   ingressClassName: nginx
    #   tlsSecretRef: kafka-ui-tls
    # gateway:
    #   parentGatewayName: external-gw
    #   parentGatewayNamespace: gateway-system
