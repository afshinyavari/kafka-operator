apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaProxy
metadata:
  name: kafka-proxy
  namespace: kafka
spec:
  clusterRef: my-kafka
  poolRef: brokers-a
  replicas: 1
  image: kroxy-filters:dev
  clientPort: 9094
  # MCS mode: the same CR is applied to every cluster in PROXY_CLUSTERS in mcs-setup.sh.
  # Each cluster's operator only deploys the proxy if its KAFKA_CLUSTER_ID is listed in
  # targetClusters; others reach status.phase=SKIPPED. The proxy Service is exported via
  # Submariner ServiceExport so cross-cluster clients resolve `kafka-proxy.kafka.svc.clusterset.local`.
  mcs:
    enabled: true
  targetClusters:
    - A
    - B
    - C
  brokerNodeIdRanges:
    - name: brokers-a
      start: 0
      end: 0
    - name: brokers-b
      start: 1000
      end: 1000
    - name: brokers-c
      start: 2000
      end: 2000
  rbacRef: kafka-rbac
  # apicurioRef: apicurio   # disabled — Kroxylicious 0.21 RecordValidation needs a
  #                           hardcoded apicurioId (one schema per filter rule) which
  #                           doesn't fit per-topic schema lookup. Apicurio is still
  #                           deployed by mcs-setup so apicurio-rbac-test runs against
  #                           it; the schema-registry filter stays off until we add a
  #                           custom per-topic filter or extend the CRD with apicurioId.
  # tls:
  #   clientCertSecretRef: kafka-proxy-client-tls   # default = "{proxyName}-client-tls"
  #   serverCertSecretRef: kafka-proxy-server-tls   # default = "{proxyName}-server-tls"
  oidc:
    # clusterset.local so the proxy in any target cluster can reach Keycloak via Submariner.
    # expectedIssuer must match Keycloak's KC_HOSTNAME (keycloak.yaml pins it to clusterset.local).
    jwksEndpointUrl: http://keycloak.kafka.svc.clusterset.local:8080/realms/demo/protocol/openid-connect/certs
    groupsClaim: realm_access.roles
    expectedIssuer: http://keycloak.kafka.svc.clusterset.local:8080/realms/demo
    expectedAudience: rbac-proxy
  filters:
    # XML filter validates produce payloads on `schemaTopic`-registered topics
    # against XSDs. Schemas are seeded via the filter's HTTP API on proxy:8080.
    xmlValidation:
      enabled: true
      schemaTopic: xml-schemas
    # Kroxylicious built-in RecordValidation. Disabled for now: the filter requires
    # a single hardcoded apicurioId per rule (not a per-topic schema lookup), which
    # our CRD doesn't model yet. Enable + extend with `apicurioId: <long>` once we
    # decide between extending the CRD or shipping a custom per-topic filter.
    schemaRegistry:
      enabled: false
      schemaType: JSON_SCHEMA
      topics:
        - orders-json
  # Uncomment to add custom filters:
  # customFilters:
  #   - name: my-filter
  #     type: com.example.MyFilterFactory
  #     config:
  #       someKey: someValue
  # External access — exposes the KafkaProxy on each cluster via MetalLB-backed
  # LoadBalancer. mcs-setup.sh installs MetalLB and advertises per-cluster pools
  # (172.19.255.{200-210,220-230,240-250}). Clients outside Kind connect to the
  # cluster-A LB IP on port 9094 with SASL_SSL + OAUTHBEARER.
  externalAccess:
    type: LOADBALANCER
    # advertisedHostTemplate: ""    # optional override; supports ${clusterId}
  #
  # Alternative — Gateway API (sniHostIdentifiesNode + TLSRoute SNI passthrough):
  #   externalAccess:
  #     type: GATEWAY
  #     advertisedHostTemplate: "${clusterId}.kafka.example.com"
  #     gateway:
  #       parentGatewayName: kafka-gateway
  #       parentGatewayNamespace: gateway-system
  #       # sectionName: tls-listener   # optional Listener sectionName on the parent Gateway
  #
  # Ingress (sniHostIdentifiesNode + nginx-ingress ssl-passthrough). Controller must run with
  # --enable-ssl-passthrough.
  #   externalAccess:
  #     type: INGRESS
  #     advertisedHostTemplate: "${clusterId}.kafka.example.com"
  #     ingress:
  #       ingressClassName: nginx
