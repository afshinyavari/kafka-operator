apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaCluster
metadata:
  name: my-kafka
  namespace: kafka
spec:
  kafkaImage: kafka-ubi:4.0.0
  kafkaVersion: "4.0"
  clusterRollOrder: ["A", "B", "C"]
  clusters:
    - id: A
      controllerAdvertisedAddress: "${CTRL_A_ADDR}"
      operatorAddress: "kafka-operator-a.kafka.svc.clusterset.local:8080"
    - id: B
      controllerAdvertisedAddress: "${CTRL_B_ADDR}"
      operatorAddress: "kafka-operator-b.kafka.svc.clusterset.local:8080"
    - id: C
      controllerAdvertisedAddress: "${CTRL_C_ADDR}"
      operatorAddress: "kafka-operator-c.kafka.svc.clusterset.local:8080"
  config:
    log.retention.hours: "168"
    num.partitions: "1"
    # RF=3 and min.insync.replicas=2 mean every produce with acks=all has to be
    # acknowledged by at least one *other* broker — i.e. exercises the
    # Submariner cross-cluster network on every write. Requires all 3 brokers
    # (one per K8s cluster) READY before topic creation; a single broker
    # outage will stall writes (by design — that's what we want to detect).
    offsets.topic.replication.factor: "3"
    transaction.state.log.replication.factor: "3"
    transaction.state.log.min.isr: "2"
    default.replication.factor: "3"
    min.insync.replicas: "2"
  # Cross-cluster proxy mTLS. The operator does NOT sign certs; it just expects
  # pre-provisioned secrets to exist (cert-manager in production, mcs-setup.sh in
  # tests). Each broker pool reads "{poolName}-broker-tls" (overridable per pool
  # via KafkaNodePoolSpec.brokerCertSecretRef). proxyPrincipal is the CN the
  # proxy presents and is added to super.users.
  # Setting proxyMtls at all opts the cluster into mTLS (no separate `enabled` toggle).
  proxyMtls:
    proxyPrincipal: kafka-proxy
  # CONTROLLER listener mTLS. Required when proxyMtls is enabled — without it, the
  # broker-side StandardAuthorizer denies ANONYMOUS inter-controller Raft traffic and
  # KRaft quorum cannot form.
  controllerTls:
    mutualTls: true
  # Kroxylicious proxy — mandatory sub-spec as of Wave 4b of the audit. mcs/targetClusters
  # are derived from `clusters[]` above (size > 1 == MCS-enabled, target = every cluster id).
  # The operator looks up the broker KafkaNodePool by label and derives brokerNodeIdRanges
  # from the deterministic node-id scheme (clusterIndex * 1000 + i).
  proxy:
    replicas: 1
    image: kroxy-filters:dev
    clientPort: 9094
    rbacRef: kafka-rbac
    # apicurioRef: apicurio   # disabled: Kroxylicious 0.21 RecordValidation requires one
    #                           hardcoded apicurioId per rule (not per-topic schema lookup).
    oidc:
      # clusterset.local so the proxy in any cluster reaches Keycloak via Submariner.
      jwksEndpointUrl: http://keycloak.kafka.svc.clusterset.local:8080/realms/demo/protocol/openid-connect/certs
      groupsClaim: realm_access.roles
      expectedIssuer: http://keycloak.kafka.svc.clusterset.local:8080/realms/demo
      expectedAudience: rbac-proxy
    filters:
      # XML filter validates produce payloads on `schemaTopic`-registered topics against XSDs.
      xmlValidation:
        enabled: true
        schemaTopic: xml-schemas
      schemaRegistry:
        enabled: false
        schemaType: JSON_SCHEMA
        topics:
          - orders-json
    externalAccess:
      type: LOADBALANCER
      # advertisedHostTemplate: ""    # optional override; supports ${clusterId}
# Uncomment to enable user-facing TLS listeners. Requires per-pod secrets named {podName}-tls
# with keys tls.crt, tls.key, ca.crt (cert-manager convention).
#  listeners:
#    - name: CLIENT_TLS
#      port: 9094
#      tls:
#        mutualTls: false   # set true to require client certificates
