apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaCluster
metadata:
  name: my-kafka
  namespace: kafka
spec:
  kafkaImage: apache/kafka:3.7.0
  kafkaVersion: "3.7"
  clusters:
    - id: A
      controllerAdvertisedAddress: "${CTRL_A_ADDR}"
    - id: B
      controllerAdvertisedAddress: "${CTRL_B_ADDR}"
    - id: C
      controllerAdvertisedAddress: "${CTRL_C_ADDR}"
  config:
    log.retention.hours: "168"
    num.partitions: "1"
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
    default.replication.factor: "1"
