---
# A basic topic. metadata.name IS the Kafka topic name.
apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
  namespace: kafka
spec:
  clusterRef: my-kafka
  partitions: 3
  replicationFactor: 3
  config:
    retention.ms: "604800000"   # 7 days
    cleanup.policy: delete
  deletionPolicy: DELETE
---
# A topic that survives CR deletion (e.g. a long-lived ingestion stream
# whose data you never want a kubectl mishap to wipe).
apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaTopic
metadata:
  name: audit-log
  namespace: kafka
spec:
  clusterRef: my-kafka
  partitions: 6
  replicationFactor: 3
  config:
    cleanup.policy: compact
    min.cleanable.dirty.ratio: "0.1"
  deletionPolicy: RETAIN
---
# A topic whose Kafka name uses characters K8s metadata.name can't express
# (uppercase, underscore). Use spec.topicName to override.
apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaTopic
metadata:
  name: legacy-orders-v2
  namespace: kafka
spec:
  clusterRef: my-kafka
  topicName: Legacy_Orders_V2
  partitions: 1
  replicationFactor: 3
