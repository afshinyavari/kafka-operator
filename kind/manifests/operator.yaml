apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-operator
  namespace: kafka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-operator
  template:
    metadata:
      labels:
        app: kafka-operator
    spec:
      serviceAccountName: kafka-operator
      # Give in-flight reconciles a chance to finish before SIGKILL. Must exceed
      # quarkus.shutdown.timeout in application.properties (currently 60s).
      terminationGracePeriodSeconds: 90
      containers:
        - name: operator
          image: kafka-operator:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_CLUSTER_ID
              value: "${KAFKA_CLUSTER_ID}"
            - name: KAFKA_NETWORKING_MCS_ENABLED
              value: "${KAFKA_NETWORKING_MCS_ENABLED}"
            - name: QUARKUS_OPERATOR_SDK_ACTIVATE_LEADER_ELECTION_FOR_PROFILES
              value: "prod"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-operator-metrics
  namespace: kafka
  labels:
    app: kafka-operator
spec:
  type: ClusterIP
  selector:
    app: kafka-operator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
# Note: the matching ServiceMonitor lives in operator-servicemonitor.yaml. It is applied
# separately by the setup scripts only when the Prometheus Operator CRDs are installed —
# applying it unconditionally fails on kind clusters that don't run prometheus-operator.
