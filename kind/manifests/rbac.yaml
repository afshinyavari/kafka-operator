apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-operator
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kafka-operator
rules:
  - apiGroups: ["kafka.yavari.afshin.se"]
    resources:
      - kafkaclusters
      - kafkaclusters/status
      - kafkaclusters/finalizers
      - kafkanodepools
      - kafkanodepools/status
      - kafkanodepools/finalizers
      - kafkapodsets
      - kafkapodsets/status
      - kafkapodsets/finalizers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "configmaps", "services", "namespaces", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["multicluster.x-k8s.io"]
    resources: ["serviceexports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# ServiceAccount for Kafka pods — used by the rack-init init container to read node labels
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-node
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kafka-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kafka-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kafka-node
subjects:
  - kind: ServiceAccount
    name: kafka-node
    namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kafka-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kafka-operator
subjects:
  - kind: ServiceAccount
    name: kafka-operator
    namespace: kafka
