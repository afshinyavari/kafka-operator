apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: ApicurioRegistry
metadata:
  # Named "apicurio" (not "schema-registry") so the resulting K8s resources
  # (Deployment "apicurio-registry", Service "apicurio-rbac-proxy") match what
  # apicurio-rbac-test.sh and other existing scripts already expect.
  name: apicurio
  namespace: kafka
spec:
  # image defaults to apicurio-registry-kafkasql:latest-snapshot
  rbacProxyImage: apicurio-rbac-proxy:dev
  rbacRef: kafka-rbac
  replicas: 3
  storage:
    type: kafkasql
    clusterRef: my-kafka
    kafkaTopic: kafkasql-journal
    # Apicurio v2.6 requires partitions=1 for total ordering. Multi-cluster HA (#19) shares
    # this single journal across all 3 cluster replicas — total ordering is load-bearing.
    kafkaTopicPartitions: 1
    tlsSecretRef: schema-registry-client-tls
    principal: apicurio-registry
  oidc:
    issuerUrl: http://keycloak.kafka.svc.clusterset.local:8080/realms/demo
    groupsClaim: realm_access.roles
  # Multi-cluster HA (#19): same CR applied to all 3 clusters; each operator filters by
  # localClusterId. ServiceExport is created implicitly because mcs.enabled=true, so
  # cross-cluster clients reach `apicurio-rbac-proxy.kafka.svc.clusterset.local`.
  mcs:
    enabled: true
  targetClusters: [A, B, C]
  # External access for the rbac-proxy Service. Requires rbacRef + rbacProxyImage.
  # Same shape as KafkaProxy / KafkaUI.
  externalAccess:
    type: LOADBALANCER
    # advertisedHostTemplate: "schema-${clusterId}.example.com"
    # ingress:
    #   ingressClassName: nginx
    #   tlsSecretRef: schema-registry-tls
    # gateway:
    #   parentGatewayName: external-gw
    #   parentGatewayNamespace: gateway-system
