apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaRbac
metadata:
  name: kafka-rbac
  namespace: kafka
spec:
  groups:
    - name: orders-team
      kafka:
        topics:
          - orders
          - orders-dlq
          - orders-xml     # XML validation filter test topic
          - orders-json    # Apicurio schema-registry filter test topic
        operations:
          - PRODUCE
          - FETCH
      schemaRegistry:
        artifacts:
          - orders
          - orders-json-value   # subject convention for orders-json's value schema
        actions:
          - READ
          - WRITE
    - name: invoices-team
      kafka:
        topics:
          - invoices
          - invoices-dlq
        operations:
          - PRODUCE
          - FETCH
      schemaRegistry:
        artifacts:
          - invoices
        actions:
          - READ
          - WRITE
    - name: schema-admin
      schemaRegistry:
        artifacts:
          - "*"
        actions:
          - READ
          - WRITE
          - DELETE
  users:
    - name: app1        # mTLS cert CN
      kafka:
        topics:
          - orders
        operations:
          - PRODUCE
