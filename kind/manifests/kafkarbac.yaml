apiVersion: kafka.yavari.afshin.se/v1alpha1
kind: KafkaRbac
metadata:
  name: kafka-rbac
  namespace: kafka
spec:
  groups:
    - name: orders-team
      kafka:
        topics:
          - orders
          - orders-dlq
          - orders-xml     # XML validation filter test topic
          - orders-json    # Apicurio schema-registry filter test topic
          - source.mm2-orders      # MM2-mirrored from the kafka-src cluster
          - source.mm2-customers   # MM2-mirrored from the kafka-src cluster
          - source.mm2-payments    # MM2-mirrored from the kafka-src cluster
        operations:
          - WRITE
          - READ
      schemaRegistry:
        artifacts:
          - orders
          - orders-json-value   # subject convention for orders-json's value schema
          - mm2-orders-value      # MM2-mirrored schema (source.mm2-orders)
          - mm2-customers-value   # MM2-mirrored schema (source.mm2-customers)
          - mm2-payments-value    # MM2-mirrored schema (source.mm2-payments)
        actions:
          - READ
          - WRITE
    - name: invoices-team
      kafka:
        topics:
          - invoices
          - invoices-dlq
        operations:
          - WRITE
          - READ
      schemaRegistry:
        artifacts:
          - invoices
        actions:
          - READ
          - WRITE
    - name: schema-admin
      schemaRegistry:
        artifacts:
          - "*"
        actions:
          - READ
          - WRITE
          - DELETE
  users:
    - name: app1        # mTLS cert CN
      kafka:
        topics:
          - orders
        operations:
          - WRITE
    # Operator / MirrorMaker2 AdminClient cert CN — mcs-setup mints kafka-operator-client
    # with CN=<proxyPrincipal> (kafka-proxy). MM2 reaches the managed cluster through the
    # proxy and must mirror arbitrary topics + manage its own internal topics, so it needs
    # unrestricted access. This is the privileged infra principal (already a broker super-user).
    - name: kafka-proxy
      kafka:
        topics: ["*"]
        operations: ["*"]
