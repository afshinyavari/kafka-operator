---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-ui
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-ui
  namespace: kafka
rules:
  - apiGroups: ["kafka.yavari.afshin.se"]
    resources: ["kafkaclusters", "kafkaproxies", "kafkarbacs", "apicurioregistries"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-ui
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: kafka-ui
    namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-ui
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ui-oidc
  namespace: kafka
stringData:
  # Matches the kafka-ui-web client secret in kind/manifests/keycloak.yaml.
  client-secret: kafka-ui-web-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      serviceAccountName: kafka-ui
      containers:
        - name: kafka-ui
          image: kafka-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OIDC_ISSUER_URL
              value: "http://keycloak.kafka.svc.clusterset.local:8080/realms/demo"
            - name: OIDC_CLIENT_ID
              value: "kafka-ui-web"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-oidc
                  key: client-secret
            # Talk to the Kroxylicious proxy over SASL_SSL with mTLS, using the
            # same client cert the rbac-test.sh script uses. RBAC enforcement is
            # still driven by the SASL JWT (alice/bob/etc.) — the cert is just
            # the transport gate.
            - name: KAFKA_UI_KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_UI_KAFKA_SSL_TLS_DIR
              value: "/etc/kafka-tls"
          volumeMounts:
            - name: kafka-client-tls
              mountPath: /etc/kafka-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kafka-client-tls
          secret:
            secretName: kafka-proxy-test-client-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
      protocol: TCP
