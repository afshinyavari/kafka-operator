---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: kafka
data:
  realm-demo.json: |
    {
      "realm": "demo",
      "enabled": true,
      "requiredCredentials": ["password"],
      "clients": [
        {
          "clientId": "rbac-proxy",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "rbac-proxy-secret",
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": false,
          "protocolMappers": [
            {
              "name": "audience-rbac-proxy",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "rbac-proxy",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "kafka-ui-web",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "kafka-ui-web-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://localhost:*",
            "http://kafka-ui.kafka.svc.cluster.local:*",
            "http://kafka-ui.kafka.svc.clusterset.local:*",
            "http://127.0.0.1:*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "audience-rbac-proxy",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "rbac-proxy",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "mm2-schema-sync",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "mm2-schema-sync-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "requiredActions": [
        {
          "alias": "VERIFY_PROFILE",
          "name": "Verify Profile",
          "providerId": "VERIFY_PROFILE",
          "enabled": false,
          "defaultAction": false,
          "priority": 90,
          "config": {}
        }
      ],
      "roles": {
        "realm": [
          { "name": "orders-team" },
          { "name": "invoices-team" },
          { "name": "schema-admin" }
        ]
      },
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "alice", "temporary": false }],
          "realmRoles": ["orders-team"]
        },
        {
          "username": "bob",
          "enabled": true,
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "bob", "temporary": false }],
          "realmRoles": ["invoices-team"]
        },
        {
          "username": "schemadmin",
          "enabled": true,
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "schemadmin", "temporary": false }],
          "realmRoles": ["schema-admin"]
        },
        {
          "username": "service-account-mm2-schema-sync",
          "enabled": true,
          "serviceAccountClientId": "mm2-schema-sync",
          "realmRoles": ["schema-admin"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: kafka
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            - name: KC_HTTP_PORT
              value: "8080"
            # Pin the issuer URL so JWT `iss` is identical regardless of whether a client
            # reaches Keycloak via `cluster.local` (local) or `clusterset.local` (cross-cluster
            # via Submariner). Without this, `iss` varies by the URL the client used, and the
            # proxy's expectedIssuer rejects one of them. Pinning to clusterset.local is what
            # makes the multi-cluster KafkaProxy work end-to-end.
            - name: KC_HOSTNAME
              value: "keycloak.kafka.svc.clusterset.local"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/demo/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: kafka
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  # ClusterIP so Submariner Lighthouse can ServiceExport it (NodePort is "UnsupportedServiceType"
  # for ServiceExport per the MCS spec). The previous NodePort was only used for browser access
  # from the host; in-cluster + cross-cluster traffic doesn't need it.
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: keycloak
  namespace: kafka
---
# External-access overlay services. Each carries the `external-access-mode` label so
# mcs-setup.sh can prune the ones that don't match the chosen $KEYCLOAK_EXTERNAL.
#
# Browser caveat (see README "External access"): KC_HOSTNAME is pinned to
# keycloak.kafka.svc.clusterset.local so the JWT `iss` claim stays consistent across
# clusters. To reach Keycloak externally without breaking OAuth flows, add an
# /etc/hosts entry mapping that name to the external IP/host.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-lb
  namespace: kafka
  labels:
    app: keycloak
    external-access-mode: loadbalancer
spec:
  selector:
    app: keycloak
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: kafka
  labels:
    app: keycloak
    external-access-mode: ingress
spec:
  ingressClassName: nginx
  rules:
    - host: __KEYCLOAK_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: kafka
  labels:
    app: keycloak
    external-access-mode: gateway
spec:
  parentRefs:
    - name: external-gw
      namespace: gateway-system
  hostnames:
    - __KEYCLOAK_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
