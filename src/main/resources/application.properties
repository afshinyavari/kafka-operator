quarkus.http.port=8080

quarkus.operator-sdk.activate-leader-election-for-profiles=prod

# Scope every reconciler's informers to the operator's own namespace. The RBAC
# (kind/manifests/rbac.yaml) is narrowed to a Role + RoleBinding accordingly --
# without this property JOSDK would default to cluster-wide LIST/WATCH and the
# operator would CrashLoop on insufficient permissions. To run against multiple
# namespaces, set this to a comma-separated list or `JOSDK_ALL_NAMESPACES`.
quarkus.operator-sdk.namespaces=kafka

quarkus.operator-sdk.reconciler.retry.max-attempts=10
quarkus.operator-sdk.reconciler.retry.interval.initial=2000
quarkus.operator-sdk.reconciler.retry.interval.multiplier=2
quarkus.operator-sdk.reconciler.retry.interval.max=60000

# Which cluster this operator instance manages.
# Must match one of spec.clusters[].id in the KafkaCluster CR.
kafka.cluster.id=${KAFKA_CLUSTER_ID}

# Set to true when the cluster fabric implements the MCS API (Cilium Cluster Mesh or Submariner).
# Creates ServiceExport resources for headless services and switches broker advertised
# listeners to *.svc.clusterset.local so brokers are reachable cross-cluster.
kafka.networking.mcs-enabled=false

quarkus.operator-sdk.crd.validate=false

%dev.quarkus.operator-sdk.crd.apply=true
%dev.kafka.cluster.id=local

%test.quarkus.operator-sdk.crd.apply=false
%test.kafka.cluster.id=test-cluster

quarkus.log.level=INFO
quarkus.log.category."se.afshin.yavari".level=DEBUG
quarkus.log.category."io.javaoperatorsdk".level=INFO
quarkus.log.category."io.fabric8".level=WARN

# JSON logging in prod (each MDC key — reconcile-id, kind, namespace, name —
# becomes a top-level field). Dev/test stay on the plain console formatter for
# readability.
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true

quarkus.smallrye-health.root-path=/healthz

# OpenTelemetry — off by default. To turn on, override:
#   quarkus.otel.sdk.disabled=false
#   quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
# Spans are emitted automatically for HTTP / Kafka AdminClient / outbound REST calls.
quarkus.application.name=kafka-operator
quarkus.otel.sdk.disabled=true
quarkus.shutdown.timeout=60S

quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=false
