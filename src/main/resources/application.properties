quarkus.http.port=8080

quarkus.operator-sdk.operator-name=kafka-operator
quarkus.operator-sdk.enable-leader-election=true

quarkus.operator-sdk.reconciler.retry.max-attempts=10
quarkus.operator-sdk.reconciler.retry.interval.initial=2000
quarkus.operator-sdk.reconciler.retry.interval.multiplier=2
quarkus.operator-sdk.reconciler.retry.interval.max=60000

# Which cluster this operator instance manages.
# Must match one of spec.clusters[].id in the KafkaCluster CR.
kafka.cluster.id=${KAFKA_CLUSTER_ID}

# Set to true when the cluster fabric implements the MCS API (Cilium Cluster Mesh or Submariner).
# Creates ServiceExport resources for headless services and switches broker advertised
# listeners to *.svc.clusterset.local so brokers are reachable cross-cluster.
kafka.networking.mcs-enabled=false

quarkus.operator-sdk.crd.validate=false

%dev.quarkus.operator-sdk.crd.apply=true
%dev.kafka.cluster.id=local

%test.quarkus.operator-sdk.crd.apply=false
%test.quarkus.operator-sdk.enable-leader-election=false
%test.kafka.cluster.id=test-cluster

quarkus.log.level=INFO
quarkus.log.category."se.afshin.yavari".level=DEBUG
quarkus.log.category."io.javaoperatorsdk".level=INFO
quarkus.log.category."io.fabric8".level=WARN

quarkus.smallrye-health.root-path=/healthz
quarkus.shutdown.timeout=60S
