# Apicurio Registry 3.x with the RBAC proxy as a sidecar (checked with registry 3.3.3). Only the
# proxy's TLS port is exposed; the registry API listens on 127.0.0.1:8080 inside the pod.
# mTLS only: no OIDC provider is involved.
#
# ConfigMap: apicurio-proxy-policy with key policy.yaml (role rules + certificate → role mapping).
# Secret with the CA bundle:
#   tls-trust-bundle             ca-bundle.crt            trust anchor for client certs and for Kafka
# Secrets from cert-manager (certificates.yaml; PEM with a PKCS#8 key, the proxy also takes PKCS12/JKS, see README):
#   apicurio-proxy-server-tls    tls.crt + tls.key        proxy's own server certificate
#   apicurio-proxy-kafka         tls.crt + tls.key        proxy's Kafka client certificate (ACL in kafkauser.yaml)
#   apicurio-registry-kafka      tls.crt + tls.key        registry's Kafka client certificate for kafkasql storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels: { app: apicurio-registry }
  template:
    metadata:
      labels: { app: apicurio-registry }
    spec:
      containers:
        - name: registry
          image: quay.io/apicurio/apicurio-registry:3.3.3      # one image in 3.x; storage is chosen by env
          ports:
            - { name: management, containerPort: 9000 }        # health and metrics, not the API
          env:
            - { name: QUARKUS_HTTP_HOST, value: "127.0.0.1" }   # API not reachable from outside the pod
            - { name: APICURIO_STORAGE_KIND, value: kafkasql }
            - { name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS, value: my-cluster-kafka-bootstrap:9093 }
            # Kafka over mTLS with the registry's own client certificate (PKCS#8 key) and the CA bundle
            - { name: APICURIO_KAFKA_COMMON_SECURITY_PROTOCOL, value: SSL }
            - { name: APICURIO_KAFKA_COMMON_SSL_KEYSTORE_TYPE, value: PEM }
            - name: APICURIO_KAFKA_COMMON_SSL_KEYSTORE_CERTIFICATE_CHAIN
              valueFrom: { secretKeyRef: { name: apicurio-registry-kafka, key: tls.crt } }
            - name: APICURIO_KAFKA_COMMON_SSL_KEYSTORE_KEY
              valueFrom: { secretKeyRef: { name: apicurio-registry-kafka, key: tls.key } }
            - { name: APICURIO_KAFKA_COMMON_SSL_TRUSTSTORE_TYPE, value: PEM }
            - name: APICURIO_KAFKA_COMMON_SSL_TRUSTSTORE_CERTIFICATES
              valueFrom: { secretKeyRef: { name: tls-trust-bundle, key: ca-bundle.crt } }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 15
        - name: rbac-proxy
          image: registry.example.com/apicurio-rbac-proxy:1.0
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: APICURIO_URL, value: "http://127.0.0.1:8080" }
            - { name: XML_SCHEMA_URL, value: "http://127.0.0.1:8080" }
            - { name: POLICY_FILE, value: /opt/rbac/policy.yaml }
            # mTLS only. Without this the proxy refuses to start when OIDC_ISSUER_URL is unset.
            # To add OIDC for humans later, remove it and set OIDC_ISSUER_URL (+ OIDC_ROLE_CLAIM).
            - { name: QUARKUS_OIDC_TENANT_ENABLED, value: "false" }
            # TLS listener; a request without a trusted client certificate gets 401
            - { name: PROXY_TLS_ENABLED, value: "true" }
            - { name: PROXY_TLS_PORT, value: "8443" }
            - { name: PROXY_TLS_CERT, value: /tls/server/tls.crt }
            - { name: PROXY_TLS_KEY,  value: /tls/server/tls.key }
            - { name: PROXY_TLS_CA,   value: /tls/trust/ca-bundle.crt }   # CAs client certificates must chain to
            - { name: PROXY_MTLS_PRINCIPAL, value: DN }          # the certificate's full subject DN
            # Kafka ACL source (the proxy's own client certificate; needs Describe on Cluster)
            - { name: PROXY_KAFKA_BOOTSTRAP, value: my-cluster-kafka-bootstrap:9093 }
            - { name: PROXY_KAFKA_SSL_CERT, value: /tls/kafka/tls.crt }
            - { name: PROXY_KAFKA_SSL_KEY,  value: /tls/kafka/tls.key }
            - { name: PROXY_KAFKA_SSL_CA,   value: /tls/trust/ca-bundle.crt }
            - { name: PROXY_KAFKA_ACL_REFRESH_SECONDS, value: "30" }
            - { name: PROXY_ARTIFACT_SUFFIXES, value: "-value,-key" }
          volumeMounts:
            - { name: server-tls,   mountPath: /tls/server, readOnly: true }
            - { name: kafka-tls,    mountPath: /tls/kafka,  readOnly: true }
            - { name: trust-bundle, mountPath: /tls/trust,  readOnly: true }
            - { name: policy,       mountPath: /opt/rbac,   readOnly: true }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 15
      volumes:
        - { name: server-tls,   secret: { secretName: apicurio-proxy-server-tls } }
        - { name: kafka-tls,    secret: { secretName: apicurio-proxy-kafka } }
        - { name: trust-bundle, secret: { secretName: tls-trust-bundle } }
        - { name: policy,       configMap: { name: apicurio-proxy-policy } }
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: kafka
spec:
  selector: { app: apicurio-registry }
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
