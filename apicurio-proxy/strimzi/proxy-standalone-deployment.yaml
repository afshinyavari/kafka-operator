# Proxy as its own Deployment in front of a registry managed by the Apicurio Registry 3 operator
# (checked with 3.3.3), or any other Apicurio 3.x registry. mTLS only: no OIDC provider is involved.
# The proxy talks to the registry's Service, and a NetworkPolicy makes the registry accept
# traffic only from the proxy pods.
#
# Two fields in the ApicurioRegistry3 CR must be set for that to hold:
#   spec.app.networkPolicy.enabled: false   the operator's own policy opens 8080 to everyone, and
#                                           NetworkPolicies add up, so ours could not close it
#   spec.ui.enabled: false                  the UI calls the API from the browser, past the proxy
# The CNI must enforce NetworkPolicy; without that the registry stays reachable on 8080.
#
# Secrets and the policy ConfigMap: same as apicurio-with-proxy-deployment.yaml (without
# apicurio-registry-kafka, which the registry's CR references itself).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-rbac-proxy
  namespace: kafka
spec:
  replicas: 2
  selector:
    matchLabels: { app: apicurio-rbac-proxy }
  template:
    metadata:
      labels: { app: apicurio-rbac-proxy }
    spec:
      containers:
        - name: rbac-proxy
          image: registry.example.com/apicurio-rbac-proxy:1.0
          ports:
            - { name: https, containerPort: 8443 }
          env:
            # The operator's Service for CR "registry" is <cr-name>-app-service.
            - { name: APICURIO_URL, value: "http://registry-app-service.kafka.svc:8080" }
            - { name: XML_SCHEMA_URL, value: "http://registry-app-service.kafka.svc:8080" }
            - { name: POLICY_FILE, value: /opt/rbac/policy.yaml }
            # mTLS only. Without this the proxy refuses to start when OIDC_ISSUER_URL is unset.
            # To add OIDC for humans later, remove it and set OIDC_ISSUER_URL (+ OIDC_ROLE_CLAIM).
            - { name: QUARKUS_OIDC_TENANT_ENABLED, value: "false" }
            - { name: PROXY_TLS_ENABLED, value: "true" }
            - { name: PROXY_TLS_PORT, value: "8443" }
            - { name: PROXY_TLS_CERT, value: /tls/server/tls.crt }
            - { name: PROXY_TLS_KEY,  value: /tls/server/tls.key }
            - { name: PROXY_TLS_CA,   value: /tls/trust/ca-bundle.crt }   # CAs client certificates must chain to
            - { name: PROXY_MTLS_PRINCIPAL, value: DN }
            - { name: PROXY_KAFKA_BOOTSTRAP, value: my-cluster-kafka-bootstrap:9093 }
            - { name: PROXY_KAFKA_SSL_CERT, value: /tls/kafka/tls.crt }
            - { name: PROXY_KAFKA_SSL_KEY,  value: /tls/kafka/tls.key }
            - { name: PROXY_KAFKA_SSL_CA,   value: /tls/trust/ca-bundle.crt }
          volumeMounts:
            - { name: server-tls,   mountPath: /tls/server, readOnly: true }
            - { name: kafka-tls,    mountPath: /tls/kafka,  readOnly: true }
            - { name: trust-bundle, mountPath: /tls/trust,  readOnly: true }
            - { name: policy,       mountPath: /opt/rbac,   readOnly: true }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: server-tls,   secret: { secretName: apicurio-proxy-server-tls } }
        - { name: kafka-tls,    secret: { secretName: apicurio-proxy-kafka } }
        - { name: trust-bundle, secret: { secretName: tls-trust-bundle } }
        - { name: policy,       configMap: { name: apicurio-proxy-policy } }
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-rbac-proxy
  namespace: kafka
spec:
  selector: { app: apicurio-rbac-proxy }
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
---
# The registry accepts traffic only from the proxy pods. The podSelector matches the labels the
# 3.x operator puts on the app pods of CR "registry"; adjust it for a registry you deploy yourself.
# To scrape registry metrics, also allow port 9000 from your monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-only-from-proxy
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: apicurio-rbac-proxy }
      ports:
        - { protocol: TCP, port: 8080 }
