# Proxy as a sidecar on a registry managed by the Apicurio Registry 3 operator (CRD ApicurioRegistry3,
# checked against operator and registry 3.3.3). mTLS only: no OIDC provider is involved.
#
# spec.app.podTemplateSpec is the base the operator builds the pod from, so the proxy container and
# its volumes are simply added next to the operator's own container (apicurio-registry-app).
#
# The registry's API port 8080 is bound to loopback, so only the proxy in the same pod reaches it.
# The operator's probes use the management port 9000 and are not affected. The NetworkPolicy at the
# bottom is a second barrier for CNIs that enforce policies.
#
# All names below are examples: Kafka cluster "my-cluster", namespace "kafka", registry "registry".
# Secrets and the policy ConfigMap are listed in README.md. A change to the policy ConfigMap is
# picked up by the running proxy; no restart is needed.
apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: registry
  namespace: kafka
spec:
  app:
    replicas: 1
    storage:
      type: kafkasql
      kafkasql:
        bootstrapServers: my-cluster-kafka-bootstrap:9093
        # The registry's own Strimzi KafkaUser (keys user.p12 / user.password) and the cluster CA
        # (keys ca.p12 / ca.password); those key names are the operator's defaults.
        tls:
          keystoreSecretRef: { name: apicurio-registry-kafka }
          keystorePasswordSecretRef: { name: apicurio-registry-kafka }
          truststoreSecretRef: { name: my-cluster-cluster-ca-cert }
          truststorePasswordSecretRef: { name: my-cluster-cluster-ca-cert }
    env:
      - { name: QUARKUS_HTTP_HOST, value: "127.0.0.1" }   # API only reachable from inside the pod
    # The operator's own NetworkPolicy opens 8080 and 9000 and nothing else; ours opens 8443.
    networkPolicy:
      enabled: false
    # No Ingress to port 8080; expose the proxy Service below instead.
    ingress:
      enabled: false
    podTemplateSpec:
      spec:
        containers:
          - name: rbac-proxy
            image: registry.example.com/apicurio-rbac-proxy:1.0
            ports:
              - { name: https, containerPort: 8443 }
            env:
              - { name: APICURIO_URL, value: "http://127.0.0.1:8080" }   # same pod
              - { name: XML_SCHEMA_URL, value: "http://127.0.0.1:8080" }
              - { name: POLICY_FILE, value: /opt/rbac/policy.yaml }
              # mTLS only. Without this the proxy refuses to start when OIDC_ISSUER_URL is unset.
              # To add OIDC for humans later, remove it and set OIDC_ISSUER_URL (+ OIDC_ROLE_CLAIM).
              - { name: QUARKUS_OIDC_TENANT_ENABLED, value: "false" }
              # HTTPS listener: server certificate + the CA that client certificates must chain to
              # (the Strimzi clients CA, so every KafkaUser certificate is accepted).
              - { name: PROXY_TLS_ENABLED, value: "true" }
              - { name: PROXY_TLS_PORT, value: "8443" }
              - { name: PROXY_TLS_KEYSTORE, value: /tls/server/server.p12 }
              - name: PROXY_TLS_KEYSTORE_PASSWORD
                valueFrom: { secretKeyRef: { name: apicurio-proxy-server-tls, key: password } }
              - { name: PROXY_TLS_TRUSTSTORE, value: /tls/clients-ca/ca.p12 }
              - name: PROXY_TLS_TRUSTSTORE_PASSWORD
                valueFrom: { secretKeyRef: { name: my-cluster-clients-ca-cert, key: ca.password } }
              - { name: PROXY_MTLS_PRINCIPAL, value: DN }               # CN=<KafkaUser name>
              # Authorization from Kafka topic ACLs, read with the proxy's own KafkaUser
              # (kafkauser.yaml). Drop these six and the two kafka volumes to authorize from
              # the `principals` section of policy.yaml only.
              - { name: PROXY_KAFKA_BOOTSTRAP, value: my-cluster-kafka-bootstrap:9093 }
              - { name: PROXY_KAFKA_SSL_KEYSTORE, value: /tls/kafka-user/user.p12 }
              - name: PROXY_KAFKA_SSL_KEYSTORE_PASSWORD
                valueFrom: { secretKeyRef: { name: apicurio-proxy-kafka, key: user.password } }
              - { name: PROXY_KAFKA_SSL_TRUSTSTORE, value: /tls/cluster-ca/ca.p12 }
              - name: PROXY_KAFKA_SSL_TRUSTSTORE_PASSWORD
                valueFrom: { secretKeyRef: { name: my-cluster-cluster-ca-cert, key: ca.password } }
            volumeMounts:
              - { name: server-tls,  mountPath: /tls/server,     readOnly: true }
              - { name: clients-ca,  mountPath: /tls/clients-ca, readOnly: true }
              - { name: kafka-user,  mountPath: /tls/kafka-user, readOnly: true }
              - { name: cluster-ca,  mountPath: /tls/cluster-ca, readOnly: true }
              - { name: policy,      mountPath: /opt/rbac,       readOnly: true }
            readinessProbe:
              httpGet: { path: /q/health/ready, port: 8443, scheme: HTTPS }
              initialDelaySeconds: 5
            livenessProbe:
              httpGet: { path: /q/health/live, port: 8443, scheme: HTTPS }
              initialDelaySeconds: 15
        volumes:
          - { name: server-tls, secret: { secretName: apicurio-proxy-server-tls } }
          - { name: clients-ca, secret: { secretName: my-cluster-clients-ca-cert } }
          - { name: kafka-user, secret: { secretName: apicurio-proxy-kafka } }
          - { name: cluster-ca, secret: { secretName: my-cluster-cluster-ca-cert } }
          - { name: policy,     configMap: { name: apicurio-proxy-policy } }
  # The UI calls the registry API from the browser, which has no client certificate.
  ui:
    enabled: false
---
# Exposes only the proxy. The operator's own Service (registry-app-service, port 8080) still
# exists but leads to a port that is bound to loopback.
apiVersion: v1
kind: Service
metadata:
  name: registry-rbac
  namespace: kafka
spec:
  selector:                            # labels the operator puts on the app pods of CR "registry"
    app.kubernetes.io/name: apicurio-registry
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: registry
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
---
# Only 8443 may be reached from outside the pod. Kubelet probes are not subject to
# NetworkPolicy in the common CNIs. To scrape registry metrics, also allow port 9000 from
# your monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-only-via-proxy
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: registry
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
