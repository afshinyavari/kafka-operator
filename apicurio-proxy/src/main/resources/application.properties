quarkus.http.port=${PROXY_PORT:8082}

# OIDC — bearer token only, no redirect/login
quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM:realm_access/roles}

# Upstream URLs
proxy.apicurio.url=${APICURIO_URL:http://apicurio:8080}
proxy.xml-schema.url=${XML_SCHEMA_URL:http://kroxylicious:8080}

# Policy file (mounted as volume in Docker)
proxy.policy.file=${POLICY_FILE:/opt/rbac/policy.yaml}

# Drain in-flight requests before hard stop (HA rolling restarts)
quarkus.shutdown.timeout=15S

# Test profile — disable real OIDC, point at unreachable upstreams so policy denials are testable
%test.quarkus.oidc.enabled=false
%test.quarkus.http.test-port=0
%test.proxy.policy.file=src/test/resources/test-policy.yaml
%test.proxy.apicurio.url=http://localhost:19999
%test.proxy.xml-schema.url=http://localhost:19999

# TLS + mTLS. The HTTPS listener itself is configured at runtime by ProxyTlsConfigSource
# from PROXY_TLS_* env vars. client-auth is build-time: "request" makes a client
# certificate optional, so OIDC bearer requests and mTLS requests coexist on one listener.
quarkus.http.ssl.client-auth=request
