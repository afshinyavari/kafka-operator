# Schema RBAC Policy
#
# Set PRINCIPAL_CLAIM env var to the JWT claim path containing roles/groups.
# Examples:
#   Keycloak:  PRINCIPAL_CLAIM=realm_access.roles
#   Azure AD:  PRINCIPAL_CLAIM=roles
#   Auth0:     PRINCIPAL_CLAIM=https://example.com/roles
#
# Each rule grants listed roles access to listed artifacts with listed actions.
# artifact: exact artifact id (e.g. "orders-value"), or "*" matching any artifact.
# Actions: READ, WRITE, DELETE
#
# principals: gives mTLS client certificates roles, so they can use the same rules as OIDC
# users on top of their Kafka ACLs. Key = the certificate principal as PROXY_MTLS_PRINCIPAL
# derives it (DN mode: "CN=<name>" for Strimzi KafkaUsers; CN mode: the bare CN). A "User:"
# prefix is accepted. A Kafka DENY on the same topic and operation still wins.
#
# principals:
#   "CN=ci-pipeline": [schema-admin]
#   "CN=payments-app": [orders-team]

rules:
  - roles:
      - "orders-team"
    resources:
      - artifact: "orders"
        actions: [READ, WRITE]

  - roles:
      - "invoices-team"
    resources:
      - artifact: "invoices"
        actions: [READ, WRITE]

  - roles:
      - "schema-admin"
    resources:
      - artifact: "*"
        actions: [READ, WRITE, DELETE]
