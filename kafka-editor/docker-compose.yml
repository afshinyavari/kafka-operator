# Local infrastructure for kafka-editor development. In-memory, not for production.
#   - Kafka (KRaft, plaintext) on localhost:9092 — the Live Run backend
#   - Apicurio Registry on http://localhost:8085 — schema import (M3.3)
#
#   docker compose up -d      # start
#   docker compose down       # stop
services:
  # Single-node Kafka (KRaft mode, plaintext). The Live Run backend connects
  # here from the host at localhost:9092.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-editor-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  apicurio:
    image: apicurio/apicurio-registry-mem:2.6.8.Final
    container_name: kafka-editor-apicurio
    ports:
      - '8085:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/apis/registry/v2/system/info || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot container that seeds a sample Avro and JSON Schema artifact.
  apicurio-seed:
    image: curlimages/curl:latest
    depends_on:
      apicurio:
        condition: service_healthy
    restart: 'no'
    command:
      - sh
      - -c
      - |
        curl -s -o /dev/null -w "order-value (AVRO): %{http_code}\n" -X POST \
          http://apicurio:8080/apis/registry/v2/groups/default/artifacts \
          -H "Content-Type: application/json" \
          -H "X-Registry-ArtifactType: AVRO" \
          -H "X-Registry-ArtifactId: order-value" \
          --data '{"type":"record","name":"Order","namespace":"demo","fields":[{"name":"orderId","type":"string"},{"name":"amount","type":"double"},{"name":"currency","type":"string"},{"name":"createdAt","type":{"type":"long","logicalType":"timestamp-millis"}},{"name":"note","type":["null","string"]},{"name":"status","type":{"type":"enum","name":"Status","symbols":["NEW","PAID","CANCELLED"]}},{"name":"customer","type":{"type":"record","name":"Customer","fields":[{"name":"id","type":"string"},{"name":"name","type":"string"}]}}]}'
        curl -s -o /dev/null -w "invoice-value (JSON): %{http_code}\n" -X POST \
          http://apicurio:8080/apis/registry/v2/groups/default/artifacts \
          -H "Content-Type: application/json" \
          -H "X-Registry-ArtifactType: JSON" \
          -H "X-Registry-ArtifactId: invoice-value" \
          --data '{"$$schema":"http://json-schema.org/draft-07/schema#","title":"Invoice","type":"object","properties":{"invoiceId":{"type":"string"},"customerId":{"type":"string"},"amount":{"type":"number"},"currency":{"type":"string"},"dueDate":{"type":"string","format":"date"},"paid":{"type":"boolean"}},"required":["invoiceId","customerId","amount"]}'
        echo "seed complete"
