# Kafka Editor backend
quarkus.http.port=8080
quarkus.application.name=kafka-editor

# The Vite dev server proxies /api here; CORS is also enabled as a fallback.
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# Kafka client logging is noisy — keep it down.
quarkus.log.category."org.apache.kafka".level=WARN

# The topology JSON carries fields the backend does not model — ignore them.
quarkus.jackson.fail-on-unknown-properties=false

# ── OIDC (web-app: authorization code + PKCE) ───────────────────────────────
# Same Keycloak realm "demo" used by KafkaProxy + apicurio-rbac-proxy. The
# operator's UIDeploymentBuilder injects these as env vars in production.
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.kafka.svc.clusterset.local:8080/realms/demo}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:kafka-editor-web}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=openid,profile
quarkus.oidc.authentication.pkce-required=true
# Hold the bearer token in the encrypted session cookie so we can forward it
# to Kafka (SASL OAUTHBEARER).
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.roles.role-claim-path=realm_access/roles
# realm_access.roles is only minted into the access token by Keycloak; the default
# web-app source is the ID token, which would yield an empty role set.
quarkus.oidc.roles.source=accesstoken
# Local + RP-initiated Keycloak logout.
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# Drain in-flight requests before hard stop
quarkus.shutdown.timeout=15S

# ── Test profile: disable real OIDC so the in-tree unit tests don't need a
#    Keycloak; fabric8 mock is left for KafkaClientProvider tests later. ────
%test.quarkus.oidc.enabled=false
%test.quarkus.http.test-port=0
