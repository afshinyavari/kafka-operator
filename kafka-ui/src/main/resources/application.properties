quarkus.http.port=${UI_PORT:8080}
quarkus.application.name=kafka-ui

# ── OIDC (web-app: authorization code + PKCE) ───────────────────────────────
# Issuer points at Keycloak realm "demo" (same realm KafkaProxy + apicurio-rbac-proxy use).
# Per-environment overrides via env vars from the Deployment manifest.
quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL:http://keycloak.kafka.svc.clusterset.local:8080/realms/demo}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:kafka-ui-web}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=openid,profile
quarkus.oidc.authentication.pkce-required=true
# Hold the bearer token in the encrypted session cookie so we can forward it
# to Kafka (SASL OAUTHBEARER) and Apicurio (Authorization: Bearer).
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.roles.role-claim-path=realm_access/roles
# realm_access.roles is only minted into the access token by Keycloak; the default
# web-app source is the ID token, which would yield an empty role set.
quarkus.oidc.roles.source=accesstoken
# Local + RP-initiated Keycloak logout. GET /logout drops the session cookie and
# redirects to Keycloak's end-session endpoint so the SSO session ends too.
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# ── Kafka UI runtime knobs ─────────────────────────────────────────────────
# Submariner-aggregated DNS suffix used to derive per-CR Service names.
kafka-ui.cluster.dns-suffix=${KAFKA_UI_DNS_SUFFIX:.svc.cluster.local}
kafka-ui.proxy.port=${KAFKA_UI_PROXY_PORT:9094}
kafka-ui.apicurio.port=${KAFKA_UI_APICURIO_PORT:8082}

# Message browser caps (defence-in-depth — UI also clamps client-side)
kafka-ui.messages.max-page-size=200
kafka-ui.messages.poll-timeout-ms=5000
kafka-ui.messages.fetch-max-bytes=4194304

# Drain in-flight requests before hard stop
quarkus.shutdown.timeout=15S

# ── CSRF (defence-in-depth alongside OIDC's SameSite=Lax session cookie) ────
# Origin/Referer must match Host on POST/PUT/PATCH/DELETE. Allow-list extras
# (comma-separated) by setting kafka-ui.csrf.allowed-origins via env var.
kafka-ui.csrf.enabled=true

# ── Test profile: disable real OIDC; fabric8 client points at mock server ──
%test.quarkus.oidc.enabled=false
%test.quarkus.http.test-port=0
%test.quarkus.kubernetes-client.devservices.enabled=false
%test.kafka-ui.cluster.dns-suffix=.svc.cluster.local
%test.kafka-ui.csrf.enabled=false
