{@se.afshin.yavari.kafka.ui.messages.MessageBrowserService$RenderedRecord row}
<tr>
    <td><code>{row.offset}</code></td>
    <td><code>{row.partition}</code></td>
    <td class="text-muted small">{row.timestamp}</td>
    <td>
        <span class="badge badge-{row.key.strategy.toLowerCase}">{row.key.strategy}{#if row.key.schemaRef}:{row.key.schemaRef}{/if}</span>
        <pre class="message-payload message-payload-key">{row.key.text}</pre>
    </td>
    <td>
        <span class="badge badge-{row.value.strategy.toLowerCase}">{row.value.strategy}{#if row.value.schemaRef}:{row.value.schemaRef}{/if}</span>
        <pre class="message-payload">{row.value.text}</pre>
    </td>
</tr>
